[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "callcenterfly"
version = "0.1.0"
description = "Experimental action-selection research using synthetic credit-union calls and a frozen fruit-fly-connectome boundary."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CallCenterFly contributors"}]
keywords = ["connectome", "fruit-fly", "contextual-bandit", "credit-union", "research"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
serve = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
neural = ["pyarrow>=17,<22"]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/creditunionfruitfly/CallCenterFly"
Repository = "https://github.com/creditunionfruitfly/CallCenterFly"
Issues = "https://github.com/creditunionfruitfly/CallCenterFly/issues"

[project.scripts]
callcenterfly = "callcenterfly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/callcenterfly"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/synthetic/*/source"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
